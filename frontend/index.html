<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F7F5F0" />
  <meta name="description" content="New Samadhan Shoe Mart - Premium Footwear Experience." />
  <title>New Samadhan Shoe Mart | Premium Footwear</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #F7F5F0;
      --primary-color: #111111;
      --accent-color: #8B0000;
    }

    /* CRITICAL: only html gets overflow-x, NOT body */
    html {
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      width: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--primary-color);
      font-family: 'Inter', sans-serif;
      /* NO overflow-x here! */
    }

    .font-editorial {
      font-family: 'Playfair Display', serif;
    }

    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("https://grainy-gradients.vercel.app/noise.svg");
      opacity: 0.04;
      pointer-events: none;
      z-index: 9999;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #F7F5F0; }
    ::-webkit-scrollbar-thumb { background: #111111; }

    /* CRITICAL: root must NOT clip vertically */
    #root {
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>
<body>
<div class="grain-overlay"></div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
